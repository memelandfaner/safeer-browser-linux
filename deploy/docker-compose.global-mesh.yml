# Safeer Global Mesh: koordinacija + STUN/TURN (referencna postavitev; Global Link je v aplikacijah se izklopljen).
# Pred javno rabo: HTTPS/WSS obratni posredovalnik pred koordinacijo, pozarni zid in kratkotrajna
# TURN poverila, vezana na Safeer avtentikacijo (staticna spodaj so samo za zagon).
services:
  coordination:
    image: python:3.13-alpine
    working_dir: /app
    command: ["python", "safeer_coordination.py"]
    user: "65534:65534"
    read_only: true
    volumes:
      - ../services/coordination:/app:ro
    environment:
      SAFEER_COORDINATION_HOST: "0.0.0.0"
      SAFEER_COORDINATION_PORT: "8787"
      SAFEER_COORDINATION_SECRET: "${SAFEER_COORDINATION_SECRET:?set a strong secret}"
    ports:
      - "127.0.0.1:8787:8787"   # samo za obratni posredovalnik (TLS) na istem strezniku
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    command:
      - -n
      - --fingerprint
      - --lt-cred-mech
      - --realm=${SAFEER_TURN_REALM:?set realm}
      - --user=${SAFEER_TURN_USER:?set user}:${SAFEER_TURN_PASSWORD:?set password}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
      # Rele ne sme odpirati poti v zasebna omrezja streznika (SSRF prek TURN).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
