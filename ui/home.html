<!DOCTYPE html>
<html lang="sl" style="background-color: #080c16; color: #f1f5f9;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safeer Browser — Linux Mint Edition</title>
  <style>
    html, body { background-color: #080c16 !important; color: #f1f5f9 !important; margin: 0; }
  </style>
  <link rel="stylesheet" href="home.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background-color: #080c16; color: #f1f5f9;">
  <div class="desktop-container">

    <!-- Top Privacy & Shield Banner -->
    <header class="shield-header">
      <div class="shield-badge">
        <span class="shield-icon">🍃</span>
        <div>
          <div class="shield-title">Safeer Browser</div>
          <div class="shield-subtitle">Linux Mint Suverena Izdaja</div>
        </div>
        <span class="shield-status">🛡️ Zaščita aktivna</span>
      </div>

      <div class="shield-metrics">
        <div class="metric-item">
          <span class="metric-val text-mint" id="adsCount">1.482</span>
          <span class="metric-lbl">Blokirani oglasi</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric-item">
          <span class="metric-val text-cyan" id="bandwidthCount">0 ms</span>
          <span class="metric-lbl">Odzivnost</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric-item">
          <span class="metric-val text-purple" id="timeCount">100%</span>
          <span class="metric-lbl" data-i18n="lbl_oss">Odprta koda</span>
        </div>
        <div class="metric-divider"></div>
        <div class="lang-pills">
          <button type="button" class="lang-pill active" data-lang="sl" onclick="changeHomeLanguage('sl')">SL</button>
          <button type="button" class="lang-pill" data-lang="en" onclick="changeHomeLanguage('en')">EN</button>
          <button type="button" class="lang-pill" data-lang="de" onclick="changeHomeLanguage('de')">DE</button>
          <button type="button" class="lang-pill" data-lang="es" onclick="changeHomeLanguage('es')">ES</button>
          <button type="button" class="lang-pill" data-lang="fr" onclick="changeHomeLanguage('fr')">FR</button>
          <button type="button" class="lang-pill" data-lang="it" onclick="changeHomeLanguage('it')">IT</button>
        </div>
      </div>
    </header>

    <!-- Center Stage: Clock & Omnibox Search -->
    <main class="center-stage">
      <div class="clock-display">
        <h1 class="clock-time" id="clockTime">12:00</h1>
        <p class="clock-date" id="clockDate">Nalaganje...</p>
      </div>

      <form class="search-form" id="searchForm" onsubmit="return handleSearch(event)">
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Iščite z Google ali vnesite spletni naslov..." autocomplete="off" autofocus>
          <button type="submit" class="search-submit" data-i18n="search_submit">Išči</button>
        </div>

        <div class="engine-pills">
          <button type="button" class="pill active" data-engine="google" onclick="setEngine('google', this)">Google</button>
          <button type="button" class="pill" data-engine="duckduckgo" onclick="setEngine('duckduckgo', this)">DuckDuckGo</button>
          <button type="button" class="pill" data-engine="brave" onclick="setEngine('brave', this)">Brave</button>
          <button type="button" class="pill" data-engine="youtube" onclick="setEngine('youtube', this)">YouTube</button>
        </div>
      </form>
    </main>

    <!-- Quick Integrations Bar -->
    <div class="integrations-quick-bar">
      <span class="quick-lbl" data-i18n="quick_lbl">Hitre možnosti:</span>
      <button class="quick-chip" onclick="openSidebar('messenger')">💬 Facebook Messenger</button>
      <button class="quick-chip" onclick="openSidebar('gmail')">✉️ Gmail</button>
      <button class="quick-chip" onclick="openSidebar('customizer')" data-i18n="quick_customizer">🧩 Teme & Skripte</button>
      <button class="quick-chip highlight" onclick="openSidebar('settings')" data-i18n="quick_toolbar">⚙️ Uredi orodno vrstico</button>
    </div>

    <!-- My Portals / Moje Strani -->
    <section class="portals-section">
      <div class="portals-head">
        <div style="display:flex; align-items:center; gap:12px;">
          <h2 class="section-title" data-i18n="section_portals">Priljubljene strani in multimedija</h2>
          <span class="portals-note" data-i18n="portals_note">Brez oglasov • Zasebno • Hitro</span>
        </div>
        <div class="portals-actions">
          <button type="button" class="portals-btn" onclick="openSidebar('edit_portals')" title="Upravljaj priljubljene strani" data-i18n="btn_edit">⚙️ Uredi</button>
          <button type="button" class="portals-btn highlight" onclick="openSidebar('add_portal')" title="Dodaj novo bližnjico" data-i18n="btn_add">➕ Dodaj stran</button>
        </div>
      </div>

      <div class="portals-grid" id="portalsGrid">
        <!-- Injected via JavaScript -->
      </div>
    </section>

  </div>

  <script src="home.js"></script>
</body>
</html>
